---
- name: Pacemaker Cluster Status Check
  hosts: all
  gather_facts: false

  tasks:
    - name: Check cluster status
      ansible.builtin.command:
        cmd: /usr/sbin/crm_mon -l
      become: true
      register: cluster_status
      changed_when: false

    - name: show cluster status
      ansible.builtin.debug:
        var: cluster_statsu.stdout_lines
