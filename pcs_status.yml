---
- name: Pacemaker Cluster Status Check
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Check cluster status
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /usr/sbin/crm_mon
          - -1
      register: cluster_status
      changed_when: false

    - name: Show cluster status
      ansible.builtin.debug:
        var: cluster_status.stdout_lines
