---
# Create an AAP Custom Credential Type using inputs and injectors below.
name: Satellite API for playbooks
kind: cloud
inputs:
  fields:
    - id: username
      type: string
      label: Satellite username
    - id: password
      type: string
      label: Satellite password
      secret: true
  required: [username, password]
injectors:
  extra_vars:
    satellite_username: '{{ username }}'
    satellite_password: '{{ password }}'

